services:
  - type: web
    name: vericore-evidence
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: PUBLIC_ACCOUNTS
        value: "true"
      - key: PUBLIC_BASE_URL
        value: https://vericore-evidence.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: CHROMA_PATH
        value: /data/chroma
      - key: USE_MOCK_LLM
        value: "false"
      - key: WORKSPACE_USERNAME
        value: owner
      - key: WORKSPACE_PASSWORD
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
